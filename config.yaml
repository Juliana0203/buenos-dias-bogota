# Configuración de "Buenos días, Bogotá".
# Los secretos NUNCA van aquí: se leen de variables de entorno
# (TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID, WEATHERAPI_KEY, OPENWEATHER_API_KEY, WAQI_TOKEN).

persona:
  name: "Juli"

location:
  city: "Bogotá"
  lat: 4.7110
  lon: -74.0721
  timezone: "America/Bogota"

schedule:
  send_time: "08:00"        # hora local de envío
  max_wait_minutes: 25      # máximo que el script espera si llega antes de la hora

# Pico y placa (placa: último dígito, 0-9, o null para desactivar la sección).
# La regla cambia cada semestre y NO se pudo verificar automáticamente: revísala en
# https://www.movilidadbogota.gov.co y ajusta `mode` y `restricted`.
#   mode: null       -> no calcula; solo recuerda consultar la regla vigente
#   mode: "weekday"  -> restricted: {0: [..dígitos..], 1: [...], ..., 4: [...]}  (0 = lunes)
#   mode: "parity"   -> restringe dígitos impares en días impares del mes y pares en días pares
pico_y_placa:
  plate: null
  mode: null
  hours: ["06:00-09:00", "15:00-19:00"]
  restricted: {}

# Umbrales: si dos fuentes difieren más que esto, se muestra un rango.
thresholds:
  temp_c: 3.0
  rain_pct: 25.0
  rain_likely_pct: 50.0     # mediana de probabilidad desde la cual la lluvia se considera probable
  rain_mm_day: 1.0          # mm/día desde los cuales un modelo "ve" lluvia
  suspect_max_pct: 5.0      # fuente sospechosa: máximo del día por debajo de esto...
  suspect_others_pct: 50.0  # ...mientras la mediana de las demás supera esto
  aqi: 30.0
  uv: 3.0
  wind_kmh: 15.0
  trm_pct: 1.5              # diferencia máxima (%) entre TRM oficial y respaldo
  trm_alert_days: 30

# Umbrales de recomendaciones.
alerts:
  rain_umbrella_pct: 40
  cold_c: 12
  hot_c: 24
  uv_high: 6
  wind_strong_kmh: 30
  feels_cold_c: 12          # sensación < esto: abrigo
  feels_mild_c: 17          # sensación 12-17: chaqueta ligera
  feels_warm_c: 22          # sensación > esto: ropa fresca

weather:
  # Modelos de Open-Meteo que votan en cada variable (temperature también aporta viento y UV).
  # ICON queda fuera de precip_probability: en Bogotá casi no reporta probabilidad (máx. ~3 %).
  models:
    temperature: ["ecmwf_ifs025", "gfs_seamless", "icon_seamless"]
    precip_probability: ["ecmwf_ifs025", "gfs_seamless"]
    precip_amount: ["ecmwf_ifs025", "gfs_seamless", "icon_seamless"]
  # Franjas del día (hora local, [inicio, fin))
  periods: {mañana: [6, 12], tarde: [12, 18], noche: [18, 24]}
  ideam:
    enabled: true
    dataset: "sbwg-7ju4"          # Temperatura ambiente del aire (datos.gov.co)
    station_code: "0021205791"    # El Dorado CATAM (Bogotá)
    max_age_hours: 3

air_quality:
  waqi_station: null              # p. ej. "@8442"; null = búsqueda por coordenadas

trm:
  soda_dataset: "32sa-8pi3"       # TRM - Superintendencia Financiera (verificado)
  backup_url: "https://open.er-api.com/v6/latest/USD"

# Porcentaje de confianza = concordancia entre fuentes (no es una probabilidad de acierto).
#   puntaje = 100 - min(spread_penalty_max, spread_penalty_per_threshold * dispersión / umbral)
#             - missing_penalty * (fuentes esperadas - fuentes que votaron)
#   si votó una sola fuente: tope single_source_cap; resultado limitado a [floor, ceiling].
confidence:
  spread_penalty_per_threshold: 30.0
  spread_penalty_max: 50.0
  missing_penalty: 8.0
  single_source_cap: 60.0
  floor: 30.0
  ceiling: 98.0

news:
  max_items: 4
  max_age_hours: 24
  dedup_threshold: 78             # similitud (0-100) para considerar duplicadas
  summary_max_words: 20
  empty_text: "Sin alertas de movilidad importantes por ahora"
  local_bonus: 3                  # puntos extra a feeds propios de Bogotá
  services_weight: 0.5            # peso de los servicios públicos frente a movilidad (1.0)
  # Feeds verificados el 2026-10-25. enabled:false = falló la verificación (403/404/vacío).
  # local:true = feed de Bogotá; los demás son nacionales y solo pasan si el texto menciona Bogotá.
  feeds:
    - {name: "El Tiempo - Bogotá", url: "https://www.eltiempo.com/rss/bogota.xml", local: true, enabled: true}
    - {name: "Semana - Bogotá", url: "https://www.semana.com/arc/outboundfeeds/rss/category/nacion/bogota/?outputType=xml", local: true, enabled: true}
    - {name: "Alcaldía de Bogotá", url: "https://bogota.gov.co/rss.xml", local: true, enabled: true}
    - {name: "El Tiempo - Colombia", url: "https://www.eltiempo.com/rss/colombia.xml", local: false, enabled: true}
    - {name: "El Espectador", url: "https://www.elespectador.com/arc/outboundfeeds/discover/?outputType=xml", local: false, enabled: true}
    - {name: "Caracol Radio", url: "https://caracol.com.co/arc/outboundfeeds/rss/?outputType=xml", local: false, enabled: true}
    - {name: "Infobae Colombia", url: "https://www.infobae.com/arc/outboundfeeds/rss/category/colombia/", local: false, enabled: true}
    # Fallaron la verificación:
    - {name: "Citytv", url: "https://citytv.com.co/feed/", local: true, enabled: false}
    - {name: "Secretaría de Movilidad", url: "https://www.movilidadbogota.gov.co/web/rss", local: true, enabled: false}
    - {name: "Transmilenio", url: "https://www.transmilenio.gov.co/rss", local: true, enabled: false}
  # Términos que prueban que la noticia es de Bogotá (se buscan en título + resumen, sin tildes).
  bogota_terms:
    ciudad: ["bogota", "capitalinos", "capital del pais", "distrito capital"]
    localidades: ["usaquen", "chapinero", "santa fe", "san cristobal", "usme", "tunjuelito", "bosa", "kennedy", "fontibon", "engativa", "suba", "barrios unidos", "teusaquillo", "los martires", "antonio narino", "puente aranda", "la candelaria", "rafael uribe", "ciudad bolivar", "sumapaz"]
    avenidas: ["autopista norte", "calle 80", "avenida boyaca", "avenida caracas", "carrera septima", "avenida el dorado", "avenida las americas", "avenida ciudad de cali", "avenida 68", "calle 26", "avenida primero de mayo", "avenida villavicencio", "calle 13", "avenida suba", "avenida jimenez", "calle 72", "calle 100"]
    sistemas: ["transmilenio", "sitp", "metro de bogota", "secretaria de movilidad", "tibabuyes", "portal norte", "portal 80", "portal sur"]
  # Prioridad 1: movilidad y calle (peso por palabra).
  mobility_keywords:
    transmilenio: 5
    sitp: 5
    "metro de bogota": 5
    "cierre vial": 5
    "cierres viales": 5
    "obras viales": 4
    obras: 3
    accidente: 4
    choque: 3
    manifestacion: 5
    manifestaciones: 5
    marcha: 5
    marchas: 5
    "pico y placa": 5
    paro: 5
    "paro de transporte": 6
    bloqueo: 5
    bloqueos: 5
    trancon: 4
    "via al llano": 5
    "autopista norte": 3
    "vias de acceso": 4
    movilidad: 3
    ciclovia: 2
    cierre: 2
  # Prioridad 2: servicios públicos y calle (se multiplican por services_weight).
  services_keywords:
    "corte de agua": 5
    "corte de luz": 5
    "corte de energia": 5
    acueducto: 3
    apagon: 5
    racionamiento: 5
    inundacion: 5
    inundaciones: 5
    "alerta por lluvia": 5
    "orden publico": 5
    disturbios: 4
  low_priority_keywords: ["farandula", "famosa", "famoso", "reality", "novela", "futbol", "liga betplay", "chisme", "horoscopo", "influenciador"]
  # Una noticia de movilidad solo entra si indica un efecto en el servicio o las vías.
  effect_keywords: ["cierre", "cierres", "desvio", "desvios", "retraso", "retrasos", "demora", "suspension", "suspende", "suspenden", "suspendido", "bloqueo", "bloqueos", "manifestacion", "manifestaciones", "marcha", "marchas", "paro", "por obra", "por obras", "obra vial", "obras viales", "accidente con afectacion", "trancon", "congestion", "afectacion", "afectaciones", "restriccion", "restricciones", "cambio de ruta", "cambio de horario", "cambios de ruta", "cambios de horario", "pico y placa", "sin servicio", "habilitan", "inhabilitada"]
  # Anécdotas: si coinciden y no hay ninguna palabra de efecto, se descarta.
  mobility_discard_keywords: ["viral", "reclamo", "video", "polémica", "me parece", "insólito", "curioso", "usuario", "pasajera", "pasajero", "TikTok", "redes sociales"]

mobility:
  show_pico_y_placa: true

good_news:
  max_age_hours: 48
  summary_max_words: 20
  # Solo feeds en español, verificados el 2026-10-25. No se traduce nada.
  feeds:
    - {name: "BBC Mundo", url: "https://feeds.bbci.co.uk/mundo/rss.xml", enabled: true}
    - {name: "DW Español", url: "https://rss.dw.com/xml/rss-sp-all", enabled: true}
    - {name: "Noticias ONU", url: "https://news.un.org/feed/subscribe/es/news/all/rss.xml", enabled: true}
    - {name: "El País - Ciencia", url: "https://feeds.elpais.com/mrss-s/pages/ep/site/elpais.com/section/ciencia/portada", enabled: true}
    - {name: "El País - Clima y Medio Ambiente", url: "https://feeds.elpais.com/mrss-s/pages/ep/site/elpais.com/section/clima-y-medio-ambiente/portada", enabled: true}
    - {name: "Europa Press - Ciencia", url: "https://www.europapress.es/rss/rss.aspx?ch=69", enabled: true}
    - {name: "Mongabay Latam", url: "https://es.mongabay.com/feed/", enabled: true}
  positive_words: ["descubrimiento", "descubren", "avance", "avanza", "record", "rescate", "rescatan", "recuperacion", "recupera", "logro", "logra", "aprobado", "aprueba", "curacion", "reduccion", "reduce", "exito", "salvan", "esperanza", "mejora"]
  negative_words: ["muerte", "muere", "muertos", "ataque", "guerra", "crisis", "accidente", "tragedia", "asesin", "bomba", "terror", "violencia", "masacre", "desastre", "secuestro", "conflicto", "invasion", "cancer", "pandemia", "derrota", "eleccion", "electoral", "balotaje", "anulacion", "fraude", "protesta", "denuncia", "polemica", "juicio", "condena", "sancion", "arancel", "trump", "bolsonaro", "politic", "gobierno", "presidente", "ataca", "heridos", "incendio", "inundacion", "sequia"]
  stopwords_en: ["the", "and", "with", "for", "from", "that", "this", "after", "will", "says"]
