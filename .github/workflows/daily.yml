name: Aviso diario inteligente

on:
  schedule:
    - cron: "40 12 * * *" # 7:40 a.m. America/Bogota (UTC-5) — principal
    - cron: "10 13 * * *" # 8:10 a.m. America/Bogota (UTC-5) — respaldo
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout del repositorio
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Configurar Python 3.12
        id: setup_python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        id: install_deps
        run: pip install -r requirements.txt

      - name: Actualizar histórico, sincronizar callbacks y enviar aviso diario
        id: send_daily
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WEATHERAPI_KEY: ${{ secrets.WEATHERAPI_KEY }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          WAQI_TOKEN: ${{ secrets.WAQI_TOKEN }}
        run: |
          git pull --rebase origin "${GITHUB_REF_NAME:-main}"
          python -m brief.main

      - name: Commit del histórico y feedback
        id: commit_history
        if: always()
        env:
          OWNER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ github.token }}
        run: |
          USER_ID=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/users/$OWNER" | jq -r .id)
          git config user.name "$OWNER"
          git config user.email "${USER_ID}+${OWNER}@users.noreply.github.com"
          git add data docs biblioteca || true
          if git diff --cached --quiet; then
            echo "Sin cambios que guardar"
            exit 0
          fi
          git commit -m "data: resumen del $(TZ=America/Bogota date +%F)"
          git pull --rebase origin "${GITHUB_REF_NAME:-main}"
          git push

      - name: Avisar por Telegram si el workflow diario falló
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OUT_INSTALL: ${{ steps.install_deps.outcome }}
          OUT_SEND: ${{ steps.send_daily.outcome }}
          OUT_COMMIT: ${{ steps.commit_history.outcome }}
        run: |
          FAILED_STEP="paso desconocido"
          if [ "$OUT_INSTALL" = "failure" ]; then
            FAILED_STEP="Instalar dependencias"
          elif [ "$OUT_SEND" = "failure" ]; then
            FAILED_STEP="Actualizar histórico y enviar aviso diario"
          elif [ "$OUT_COMMIT" = "failure" ]; then
            FAILED_STEP="Commit del histórico"
          fi
          MSG="el resumen de hoy falló en '${FAILED_STEP}': revisa Actions"
          echo "::error::${MSG}"
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -fsS --max-time 15 -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=${MSG}" \
              >/dev/null || echo "::warning::No se pudo enviar la alerta de fallo a Telegram."
          fi
          exit 1
