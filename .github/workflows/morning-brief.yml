name: Resumen matutino

on:
  schedule:
    - cron: "40 12 * * *" # 7:40 a.m. America/Bogota (UTC-5)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: morning-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Enviar resumen
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WEATHERAPI_KEY: ${{ secrets.WEATHERAPI_KEY }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          WAQI_TOKEN: ${{ secrets.WAQI_TOKEN }}
        run: python -m brief.main

      - name: Commit del histórico
        env:
          OWNER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ github.token }}
        run: |
          USER_ID=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/users/$OWNER" | jq -r .id)
          git config user.name "$OWNER"
          git config user.email "${USER_ID}+${OWNER}@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "Sin cambios que guardar"
            exit 0
          fi
          git commit -m "data: resumen del $(TZ=America/Bogota date +%F)"
          git pull --rebase
          git push
